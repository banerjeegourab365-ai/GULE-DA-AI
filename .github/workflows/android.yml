name: Build GULE DA Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Extract project
        run: |
          unzip -o GULE_DA_Web_and_Android_Starter.zip -d app
          cd app
          npm install
          npm run build
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Build APK
        run: |
          cd app/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GULE-DA-APK
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
